name: Git Back-Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  back-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Create Pull Request from main to develop
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop main

          if git diff --quiet origin/develop..origin/main; then
            echo "No differences between main and develop. Skipping PR creation."
            exit 0
          fi

          existing_pr=$(gh pr list --head main --base develop --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing_pr" ]; then
            echo "Pull Request from main to develop already exists: #$existing_pr"
            exit 0
          fi

          # Intento 1: GITHUB_TOKEN (requiere setting 'Allow GitHub Actions to create PRs').
          # Intento 2: ADMIN_PAT (token admin). El paso nunca falla: el back-merge se completa manualmente.
          if ! gh pr create \
            --title "chore(git): back-sync main into develop" \
            --body "Automated Pull Request to sync changes from main back to develop branch." \
            --head main \
            --base develop 2>&1; then
            echo "GITHUB_TOKEN could not create the PR (repo setting). Retrying with ADMIN_PAT..."
            if [ -n "$ADMIN_TOKEN" ]; then
              export GH_TOKEN="$ADMIN_TOKEN"
              gh pr create \
                --title "chore(git): back-sync main into develop" \
                --body "Automated Pull Request to sync changes from main back to develop branch." \
                --head main \
                --base develop 2>&1 || echo "ADMIN_PAT also failed — manual back-merge required."
            fi
          fi
