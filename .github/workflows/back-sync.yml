name: Git Back-Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  back-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Back-merge main into develop
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop main

          if git diff --quiet origin/develop..origin/main; then
            echo "No differences between main and develop. Nothing to do."
            exit 0
          fi

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_PAT not configured — falling back to PR creation."
            gh pr create \
              --title "chore(git): back-sync main into develop" \
              --body "Automated Pull Request to sync changes from main back to develop branch." \
              --head main \
              --base develop
            exit 0
          fi

          # Back-merge directo main -> develop usando un token con bypass del ruleset de develop.
          git remote set-url origin "https://x-access-token:${ADMIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B back-sync origin/develop
          git merge origin/main -m "chore(git): back-sync main into develop [skip ci]"
          git push origin back-sync:develop
          echo "Back-merge main -> develop completed."
