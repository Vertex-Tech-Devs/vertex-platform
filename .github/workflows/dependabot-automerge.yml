name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Approve and auto-merge minor & patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          TOKEN="${ADMIN_TOKEN:-$GH_TOKEN}"
          GH_TOKEN="$TOKEN" gh pr review --approve "$PR_URL" || echo "gh pr review skipped or not permitted"
          GH_TOKEN="$TOKEN" gh pr merge --auto --squash --delete-branch "$PR_URL" || \
          GH_TOKEN="$TOKEN" gh pr merge --squash --delete-branch "$PR_URL" || echo "gh pr merge failed"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
