name: PR Preview Deploy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  checks: write
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preview-deploy:
    name: Preview Deploy (Platform Admin)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Tests
        run: |
          npm --prefix vertex-platform run lint
          npm --prefix vertex-platform run test

      - name: Build Platform Application
        run: npm --prefix vertex-platform run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'
          projectId: 'vertex-platform-dev'
          channelId: 'pr-${{ github.event.number }}'
          expires: 7d
