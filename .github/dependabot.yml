version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-eslint/*"]
      firebase:
        patterns: ["firebase*", "@angular/fire"]
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      testing:
        patterns: ["karma*", "jasmine*", "cypress*", "vitest*", "@vitest/*", "@playwright/*"]
      dev-tools:
        patterns: ["eslint*", "prettier*", "typescript", "stylelint*", "lint-staged*", "@commitlint/*", "husky*", "tsx*", "@clack/*", "start-server-and-test*"]
      dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/functions"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      functions-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
