<div class="platform-shell">
  <div
    class="platform-backdrop"
    [class.platform-backdrop--active]="isSidebarOpen()"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <aside class="platform-sidebar" [class.sidebar-open]="isSidebarOpen()">
    <div class="sidebar-header">
      <span class="sidebar-logo">Vertex</span>
      <span class="sidebar-tagline">Platform</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Comercio & Negocio</div>
      <a
        class="nav-item"
        routerLink="/stores"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="closeSidebar()"
      >
        <i class="bi bi-shop-window"></i>
        <span>Tiendas</span>
      </a>

      @if (auth.isSuperAdmin()) {
        <a
          class="nav-item"
          routerLink="/settings/subscriptions"
          routerLinkActive="nav-item--active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-cash-stack"></i>
          <span>Suscripciones SaaS</span>
        </a>

        <div class="nav-section-label mt-3">Operaciones Cloud</div>
        <a
          class="nav-item"
          routerLink="/settings/infrastructure"
          routerLinkActive="nav-item--active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-server"></i>
          <span>Infraestructura GCP</span>
        </a>

        <div class="nav-section-label mt-3">Administración</div>
        <a
          class="nav-item"
          routerLink="/settings/team"
          routerLinkActive="nav-item--active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-people"></i>
          <span>Equipo</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">{{ userInitial() }}</div>
        <span class="user-email">{{ auth.user()?.email }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="platform-main" [class.platform-main--dimmed]="isSidebarOpen()">
    <header class="platform-header">
      <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <span class="header-brand">Vertex Platform</span>
      @if (isDevEnv) {
        <span class="env-badge">ENTORNO DEV</span>
      }
      <div class="header-actions">
        <button
          class="theme-toggle"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.resolved() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          [title]="theme.resolved() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        >
          @if (theme.resolved() === 'dark') {
            <i class="bi bi-sun-fill"></i>
          } @else {
            <i class="bi bi-moon-stars-fill"></i>
          }
        </button>
      </div>
    </header>

    <main class="platform-content">
      <router-outlet />
    </main>
  </div>
</div>
